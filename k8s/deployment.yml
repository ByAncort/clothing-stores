apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-landing-page
  labels:
    app: ecommerce-landing-page
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerce-landing-page
  template:
    metadata:
      labels:
        app: ecommerce-landing-page
    spec:
      containers:
      - name: ecommerce-app
        image: ghcr.io/your-username/your-repo:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-service
spec:
  selector:
    app: ecommerce-landing-page
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer