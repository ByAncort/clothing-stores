spring.application.name=ms-productos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
server.port=${SERVER_PORT:8085}

spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

logging.level.root=INFO
logging.level.com.staycold=DEBUG
logging.level.com.staycold.ms.exception=DEBUG
logging.level.org.springframework.web.servlet.resource.ResourceHttpRequestHandler=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Credenciales fijas para login por formulario
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Opcional: hacer que Spring MVC lance NoHandlerFoundException en lugar de 404 por defecto
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

